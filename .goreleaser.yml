version: 2

builds:
  - binary: quasar
    # The cockpit (browser fleet dashboard) is gated behind the `cockpit` build
    # tag: without it, embed_disabled.go ships an empty asset FS and the cockpit
    # serves no CSS/Datastar. The committed *_templ.go and cockpit.css mean no
    # codegen is needed at release time — just the tag.
    flags:
      - -tags=cockpit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w -X github.com/papapumpkin/quasar/cmd.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "quasar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))?\!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?\!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^ci'
      - '^test'
      - '^style'

brews:
  - name: quasar
    # Write the formula to Formula/quasar.rb — the canonical path Homebrew reads.
    # Without this GoReleaser writes quasar.rb at the tap root, which a stale
    # Formula/quasar.rb then shadows, so `brew upgrade` never sees the new version.
    directory: Formula
    repository:
      owner: papapumpkin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/papapumpkin/quasar"
    description: "Astral themed agent orchestration system inspired by Gas Town"
    license: "MIT"
    install: |
      bin.install "quasar"
    test: |
      assert_match version.to_s, shell_output("#{bin}/quasar version")

snapshot:
  name_template: "{{ .Version }}-next"
