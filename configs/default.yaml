# Quasar default configuration
# Copy to .quasar.yaml in your project root to customize.

# Path to claude CLI binary
claude_path: claude

# Path to beads CLI binary
beads_path: beads

# Working directory for agent invocations
work_dir: "."

# Maximum coder-reviewer cycles before giving up
max_review_cycles: 3

# Maximum total budget in USD per task
max_budget_usd: 5.0

# Claude model to use (empty = CLI default)
model: ""

# Override system prompts (empty = use built-in defaults)
coder_system_prompt: ""
reviewer_system_prompt: ""

# Lint commands run after each coder pass (default: go vet, go fmt)
lint_commands:
  - "go vet ./..."
  - "go fmt ./..."

# Verbose output
verbose: false

# --- Optional sections (empty by default) -----------------------------------
# A freshly-installed Quasar ships with no integrations, forge, pre-commit, or
# verify configuration. Run `quasar init` in a project to generate a populated
# .quasar.yaml, or uncomment and edit the templates below.

# External ticket sources. Tokens are NEVER stored here: set token_env (an env
# var name) or token_file (a Docker secret path). An inline `token:` value is a
# config-load error.
# integrations:
#   github:
#     repo: "owner/repo"
#     token_env: "GITHUB_TOKEN"
#     # token_file: "/run/secrets/github_token"

# Forge (PR creation) — reserved for a later release; schema documented here.
# forge:
#   github:
#     repo: "owner/repo"
#     token_env: "GITHUB_TOKEN"

