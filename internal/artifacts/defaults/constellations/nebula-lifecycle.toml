name        = "nebula-lifecycle"
description = "Full lifecycle fired by Approve: architect plans the seed into phases, per-phase execution, then master review, then ship or fix."

# Plan stage: the architect decomposes the seed nebula into phases and persists
# them. Runs as a nested constellation so a single Approve fires one constellation
# that plans AND builds. execute_phases re-reads the nebula (dispatch_phase_iterator
# loads it fresh), so it sees the phases this stage just persisted.
[[nodes]]
id   = "plan"
type = "constellation"
ref  = "architect"

[[nodes]]
id     = "execute_phases"
type   = "phase_iterator"
inputs = { sub_constellation = "coder-reviewer", parallel = "${nebula.execution.max_workers}" }

[[nodes]]
id   = "master_review"
type = "constellation"
ref  = "master-review"

[[nodes]]
id   = "ship"
type = "constellation"
ref  = "open-pr"

[[nodes]]
id   = "fix"
type = "constellation"
ref  = "architect-fix"

[[edges]]
from = "plan"
to   = "execute_phases"

[[edges]]
from = "execute_phases"
to   = "master_review"
when = "execute_phases.all_phases_complete"

[[edges]]
from = "master_review"
to   = "ship"
when = "master_review.decision == 'ship'"

[[edges]]
from = "master_review"
to   = "fix"
when = "master_review.decision == 'fix' && fix_cycles < 3"

[[edges]]
from = "master_review"
to   = "_awaiting_human"
when = "master_review.decision == 'escalate' || fix_cycles >= 3"

[[edges]]
from = "fix"
to   = "execute_phases"
when = "fix.phases_appended"

[[edges]]
from = "ship"
to   = "_done"
when = "ship.pr_opened"
