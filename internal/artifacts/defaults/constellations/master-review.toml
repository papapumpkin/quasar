name        = "master-review"
description = "Reviews a completed nebula's full diff and decides ship vs spawn-fix vs escalate. Within-cap fixes dispatch the coder-reviewer constellation as a real inner loop; the outer cycle counter advances on each back-edge so meta.max_cycles eventually trips."

# max_cycles is the declarative cap on master-review fix cycles. It is the
# embedded default; a repo's constellations/master-review.toml may override it at
# the file level, and a nebula's [execution].max_review_cycles overrides it per
# run. The runtime resolves the effective value at Fire time and surfaces it to
# the edge guards below as meta.max_cycles — no cycle limit is hardcoded in Go.
[meta]
max_cycles = 3

[[nodes]]
id     = "review"
type   = "star"
star   = "master-reviewer-star"
inputs = { nebula_diff = "${nebula.full_diff}", verify_results = "${nebula.verify_results}" }

# decide parses the reviewer star's JSON output into a typed decision the edges
# below route on. It is the single producer of `decision` (ship/fix/escalate);
# the star itself only emits raw JSON matching master-review-decision-v1.
[[nodes]]
id     = "decide"
type   = "builtin"
op     = "master_review_decision"
inputs = { output = "${nodes.review.result_json}" }

# fix dispatches the coder-reviewer constellation as a child run. The
# reviewer's feedback becomes the synthetic phase body the inner coder reads;
# the inner constellation runs to its own terminal state before this node
# completes. The unconditional edge back to `review` is the load-bearing
# back-edge: each traversal increments `cycle` on the outer run, so
# meta.max_cycles eventually trips and routes through give-up → _failed.
# NodeConstellation dispatch (constellations/dispatch_constellation.go) makes
# this real; the PLACEHOLDER routing this used to carry to _awaiting_human is
# gone.
[[nodes]]
id     = "fix"
type   = "constellation"
ref    = "coder-reviewer"
inputs = { phase_body = "${nodes.decide.feedback}", phase_title = "master-review fix", review = "''" }

# give-up terminates the run with a structured failure reason when the master
# reviewer still wants changes after the cycle cap is exhausted. Its output feeds
# the unconditional _failed edge below, so no PR is opened.
[[nodes]]
id     = "give-up"
type   = "builtin"
op     = "fail_run"
inputs = { reason = "max master-review cycles exhausted", detail = "${nodes.decide.feedback}" }

[[edges]]
from = "review"
to   = "decide"

[[edges]]
from = "decide"
to   = "_done"
when = "nodes.decide.decision == 'ship'"

[[edges]]
from = "decide"
to   = "_awaiting_human"
when = "nodes.decide.decision == 'escalate'"

# Within-cap fix: dispatch the inner coder-reviewer constellation. It runs to
# completion before this node's outputs land.
[[edges]]
from = "decide"
to   = "fix"
when = "nodes.decide.decision == 'fix' && cycle < meta.max_cycles"

[[edges]]
from = "decide"
to   = "give-up"
when = "nodes.decide.decision == 'fix' && cycle >= meta.max_cycles"

# Back-edge: a successful coder-reviewer pass re-enters review so the master
# reviewer can judge the freshly-applied fix. The runtime detects the
# back-edge (target precedes source in node order) and increments cycle.
[[edges]]
from = "fix"
to   = "review"
when = "nodes.fix.state == 'done'"

# If the inner coder-reviewer itself fails (e.g. its own cycle cap exhausted),
# propagate the failure to the outer run rather than looping. The parent's
# fail_run path already records a structured _error from the dispatch.
[[edges]]
from = "fix"
to   = "_failed"
when = "nodes.fix.state != 'done'"

[[edges]]
from = "give-up"
to   = "_failed"

[outputs]
decision = "${nodes.decide.decision}"
feedback = "${nodes.decide.feedback}"
