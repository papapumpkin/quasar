name        = "merge-conflict-resolve"
description = "Resolve a merge conflict using the conflict-resolver star and a rich prompt context that preserves both workstreams' intent. Up to [meta].max_cycles attempts, then escalates."

# The resolve-then-judge loop. render -> resolve -> decide, with a decide ->
# render back-edge that re-renders the context and re-invokes the resolver for
# one more pass. Each back-edge is one cycle, counted by the same runtime
# back-edge counter every other loop uses, so [meta].max_cycles is enforced with
# no Go constant. Beyond the cap (or on a needs_human verdict) the run escalates
# to _awaiting_human rather than committing work the resolver could not green.
[meta]
max_cycles = 2

# Assemble the structured context: both workstreams' specs, both diffs, both
# phases' entanglements, and either the conflicted files (markers) or the build
# error output (no_markers). The src_*/dst_* spec and diff inputs are threaded by
# the firing supervisor (deferred); merge-gate supplies mode, files/build_output,
# and the worktree today.
[[nodes]]
id   = "render"
type = "builtin"
op   = "render_conflict_context"
inputs = { mode = "${inputs.mode}", files = "${inputs.files}", build_output = "${inputs.build_output}", worktree = "${inputs.worktree}", src_run_id = "${inputs.src_run_id}", dst_run_id = "${inputs.dst_run_id}" }

# Invoke the conflict-resolver star. It Edits only files carrying conflict markers
# or build errors, then emits a conflict-resolution-result-v1 JSON object.
[[nodes]]
id     = "resolve"
type   = "star"
star   = "conflict-resolver"
inputs = { prompt = "${nodes.render.context}", worktree = "${inputs.worktree}" }

# Parse the resolver's JSON and apply the universal escalation guards (config
# file, delete-vs-modify on protected paths) — those short-circuit to
# needs_human regardless of what the resolver claimed.
[[nodes]]
id     = "decide"
type   = "builtin"
op     = "conflict_resolution_decision"
inputs = { output = "${nodes.resolve.result}", files = "${inputs.files}", delete_modify = "${inputs.delete_modify}" }

# Terminal telemetry: every resolution run — committed or escalated — passes
# through here exactly once after the cycle loop settles, recording one outcome
# row for `quasar conflicts report`. The back-edge (decide -> render) bypasses
# this node, so a retried cycle is not double-counted; Cycles is read from run
# State so the row reflects the final back-edge count. A runtime with no conflict
# log injected makes this a no-op.
[[nodes]]
id     = "emit"
type   = "builtin"
op     = "emit_conflict_telemetry"
inputs = { mode = "${inputs.mode}", files = "${inputs.files}", status = "${nodes.decide.status}", files_changed = "${nodes.decide.files_changed}", src_run_id = "${inputs.src_run_id}", dst_run_id = "${inputs.dst_run_id}" }

# Resolved with a green build: commit the merged state and produce the merge SHA.
[[nodes]]
id     = "commit"
type   = "builtin"
op     = "commit"
inputs = { message = "resolve merge conflict between workstreams" }

# Cycle cap exhausted or the resolver requested human review: terminate with a
# structured reason; the unconditional edge to _awaiting_human surfaces it.
[[nodes]]
id     = "give_up"
type   = "builtin"
op     = "fail_run"
inputs = { reason = "conflict-resolver could not produce a green build", detail = "${nodes.decide.escalation_reason}" }

[[edges]]
from = "render"
to   = "resolve"

[[edges]]
from = "resolve"
to   = "decide"

# Build still broken after this pass and a cycle remains: re-render and retry.
# render is declared before decide, so this is a back-edge — it counts a cycle.
# This is the only decide edge that bypasses the emit telemetry node, so a
# retried cycle is never recorded as its own resolution outcome.
[[edges]]
from = "decide"
to   = "render"
when = "nodes.decide.status == 'resolved' && !nodes.decide.build_passed && cycle < meta.max_cycles"

# Any terminal verdict — green resolution, human escalation, or an exhausted
# cycle cap — flows through emit so the outcome is recorded before the run ends.
[[edges]]
from = "decide"
to   = "emit"
when = "(nodes.decide.status == 'resolved' && nodes.decide.build_passed) || nodes.decide.status == 'needs_human' || (nodes.decide.status == 'resolved' && !nodes.decide.build_passed && cycle >= meta.max_cycles)"

# After recording, split on the same verdict the row captured: a green
# resolution commits; everything else (escalation or exhausted cap) gives up.
[[edges]]
from = "emit"
to   = "commit"
when = "nodes.decide.status == 'resolved' && nodes.decide.build_passed"

[[edges]]
from = "emit"
to   = "give_up"
when = "nodes.decide.status == 'needs_human' || (nodes.decide.status == 'resolved' && !nodes.decide.build_passed)"

[[edges]]
from = "commit"
to   = "_done"

[[edges]]
from = "give_up"
to   = "_awaiting_human"

[outputs]
merged_sha = "${nodes.commit.sha}"
