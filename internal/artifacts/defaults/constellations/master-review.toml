name        = "master-review"
description = "Reviews a completed nebula's full diff and decides ship vs spawn-fix vs escalate, failing the run once the declarative cycle cap is exhausted."

# max_cycles is the declarative cap on master-review fix cycles. It is the
# embedded default; a repo's constellations/master-review.toml may override it at
# the file level, and a nebula's [execution].max_review_cycles overrides it per
# run. The runtime resolves the effective value at Fire time and surfaces it to
# the edge guards below as meta.max_cycles — no cycle limit is hardcoded in Go.
[meta]
max_cycles = 3

[[nodes]]
id     = "review"
type   = "star"
star   = "master-reviewer-star"
inputs = { nebula_diff = "${nebula.full_diff}", verify_results = "${nebula.verify_results}" }

# decide parses the reviewer star's JSON output into a typed decision the edges
# below route on. It is the single producer of `decision` (ship/fix/escalate);
# the star itself only emits raw JSON matching master-review-decision-v1.
[[nodes]]
id     = "decide"
type   = "builtin"
op     = "master_review_decision"
inputs = { output = "${nodes.review.result}" }

# give-up terminates the run with a structured failure reason when the master
# reviewer still wants changes after the cycle cap is exhausted. Its output feeds
# the unconditional _failed edge below, so no PR is opened.
[[nodes]]
id     = "give-up"
type   = "builtin"
op     = "fail_run"
inputs = { reason = "max master-review cycles exhausted", detail = "${nodes.decide.feedback}" }

[[edges]]
from = "review"
to   = "decide"

[[edges]]
from = "decide"
to   = "_done"
when = "nodes.decide.decision == 'ship'"

[[edges]]
from = "decide"
to   = "_awaiting_human"
when = "nodes.decide.decision == 'escalate'"

[[edges]]
from = "decide"
to   = "_done"
when = "nodes.decide.decision == 'fix' && cycle < meta.max_cycles"

[[edges]]
from = "decide"
to   = "give-up"
when = "nodes.decide.decision == 'fix' && cycle >= meta.max_cycles"

[[edges]]
from = "give-up"
to   = "_failed"

[outputs]
decision = "${nodes.decide.decision}"
feedback = "${nodes.decide.feedback}"
