[nebula]
name = "additional-sensors"
description = "Three more sensor implementations beyond github_issues: linear (project mgmt ingest), slack_mention (@quasar in a channel triggers a nebula), cron (synthetic schedule-driven nebulas for nightly tasks). Plus a sensor-authoring guide so external contributors can add their own."

[defaults]
type = "task"
priority = 2
labels = ["quasar", "sensors"]
assignee = ""

[execution]
max_workers = 1
max_review_cycles = 5
max_budget_usd = 35.0
model = ""
gate = "trust"

[context]
repo = "github.com/papapumpkin/quasar"
working_dir = "."
goals = [
    "Linear sensor polls a project's open issues and produces seed nebulas, dedup by (workspace, issue key)",
    "Slack-mention sensor polls a channel for @quasar mentions; the mention author + the message body become the seed nebula",
    "Cron sensor fires synthetic events on a cron schedule (e.g. nightly dependency-bump nebula)",
    "Sensors share a common test-helper kit so adding a 4th is mechanical",
    "Authoring guide doc shows the minimum interface to satisfy",
]
constraints = [
    "Each sensor is its own subpackage under internal/sensors/<name>/",
    "No shared registry types — Sensor interface from Phase 1 of constellation-runtime is the only contract",
    "Secrets resolved via the same chain: secret_file > secret_env > vendor-CLI-fallback",
    "Each sensor has a unique cursor format; runtime stores it as opaque JSON",
]

[dependencies]
requires_nebulae = ["constellation-runtime"]
