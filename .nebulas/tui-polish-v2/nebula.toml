[nebula]
name = "tui-polish-v2"
description = "TUI quality-of-life improvements: glamour markdown rendering, unified diff layout, board phase name truncation, live token count, richer worker cards, and fix +0 -0 line count bug"

[defaults]
type = "bug"
priority = 2
labels = ["quasar", "tui"]
assignee = ""

[execution]
max_workers = 2
max_review_cycles = 5
max_budget_usd = 60.0
model = ""
gate = ""

[context]
repo = "github.com/papapumpkin/quasar"
working_dir = "."
goals = [
    "Render markdown content (cycle summaries, reviewer reports, escalation context) with glamour instead of raw text",
    "Switch diff view from side-by-side to unified top/bottom layout with red/blue coloring like Claude Code",
    "Fix phase name truncation in board view so names are readable",
    "Fix the +0 -0 line count bug in phase summaries",
    "Make worker cards show richer activity information",
    "Ensure live token count updates during execution",
]
constraints = [
    "glamour is the only new dependency (charmbracelet/glamour) — it's part of the Charm ecosystem already used",
    "All existing tests must pass after every phase",
    "go build, go vet ./... must pass after every phase",
    "No behavior change to headless/stderr mode — only TUI rendering changes",
    "Maintain terminal width responsiveness — all layouts must degrade gracefully on narrow terminals",
]

[dependencies]
requires_beads = []
requires_nebulae = []
